<!DOCTYPE html>
<html data-theme="{{theme}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" id="theme-dark" href="{markserv}templates/github-markdown-dark.css"{{#unless themeDark}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-light" href="{markserv}templates/github-markdown-light.css"{{#unless themeLight}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-synthwave" href="{markserv}templates/github-markdown-synthwave.css"{{#unless themeSynthwave}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-solarized" href="{markserv}templates/github-markdown-solarized.css"{{#unless themeSolarized}} disabled{{/unless}}>
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<link rel="stylesheet" href="{markserv}templates/comments.css">
	<script type="text/javascript" id="MathJax-script" async
	      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
</head>
<body>
<article class="markdown-body">
<div id="marker-content">
{{{content}}}
</div>
<footer><sup><hr> Served by <a href="https://github.com/markserv/markserv" target="_blank" rel="noopener noreferrer">markserv</a>-marker | <a href="/">index</a> | PID: {{pid}}</sup></footer>
</article>
<div class="page-controls">
	<a class="page-btn" id="index-link" href="/" title="Index page">🏠</a>
	<button class="page-btn" id="width-toggle" title="Expand to window width">⛶</button>
	<button class="page-btn" id="theme-toggle" title="Toggle theme"></button>
</div>
<script>
(function() {
	var themes = ['dark', 'light', 'synthwave', 'solarized'];
	var icons = {dark: '\u{1F319}', light: '\u{2600}\u{FE0F}', synthwave: '\u{1F9D1}\u{200D}\u{1F3A4}', solarized: '\u{262F}\u{FE0F}'};
	var serverTheme = '{{theme}}' || 'dark';
	var current = localStorage.getItem('markserv-theme') || serverTheme;

	function applyTheme(t) {
		document.documentElement.setAttribute('data-theme', t);
		themes.forEach(function(name) {
			var el = document.getElementById('theme-' + name);
			if (el) el.disabled = (name !== t);
		});
		var btn = document.getElementById('theme-toggle');
		if (btn) btn.textContent = icons[t] || icons.dark;
		current = t;
	}

	applyTheme(current);

	document.getElementById('theme-toggle').addEventListener('click', function() {
		var idx = themes.indexOf(current);
		var next = themes[(idx + 1) % themes.length];
		localStorage.setItem('markserv-theme', next);
		applyTheme(next);
	});
})();
</script>
<script>
(function() {
	var btn = document.getElementById('width-toggle');
	if (!btn) return;
	var KEY = 'markserv-marker-wide';

	function apply(wide) {
		document.body.style.width = wide ? '100%' : '';
		btn.textContent = wide ? '\u25A3' : '\u26F6';
		btn.title = wide ? 'Back to default width' : 'Expand to window width';
	}

	apply(localStorage.getItem(KEY) === '1');

	btn.addEventListener('click', function() {
		var next = document.body.style.width !== '100%';
		localStorage.setItem(KEY, next ? '1' : '0');
		apply(next);
	});
})();
</script>
{{#if hotreload}}
<script>
(function() {
	var ws;
	var delay = 1000;
	var maxDelay = 30000;
	var maxRetries = 20;
	var retries = 0;

	function connect() {
		ws = new WebSocket('ws://localhost:{{wsPort}}');
		ws.onopen = function() {
			delay = 1000;
			retries = 0;
			ws.send(JSON.stringify({path: location.pathname}));
		};
		ws.onmessage = function(e) {
			var msg;
			try { msg = JSON.parse(e.data); } catch (err) { return; }
			if (msg.type === 'reload') {
				var el = document.getElementById('marker-content');
				if (el) el.innerHTML = msg.html;
				document.dispatchEvent(new CustomEvent('marker:reload'));
			} else if (msg.type === 'comments') {
				document.dispatchEvent(new CustomEvent('marker:comments'));
			}
		};
		ws.onclose = function() {
			if (retries < maxRetries) {
				retries++;
				setTimeout(connect, delay);
				delay = Math.min(delay * 2, maxDelay);
			}
		};
	}
	connect();
})();
</script>
{{/if}}
{{#if fileId}}
<script>
window.__marker = {
	fileId: '{{fileId}}',
	apiBase: '/api',
	hotreload: {{#if hotreload}}true{{else}}false{{/if}}
};
</script>
<script src="{markserv}templates/comments.js" defer></script>
{{/if}}
</body>
</html>
